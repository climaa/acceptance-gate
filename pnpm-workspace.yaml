packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# eslint-plugin-boundaries and @boundaries/elements pin handlebars to exactly 4.7.9,
# which carries GHSA advisories fixed in 4.7.10, so no in-range refresh reaches the
# patch. It only runs inside ESLint. Remove this entry once eslint-plugin-boundaries
# ships with handlebars >=4.7.10.
overrides:
  handlebars: 4.7.10
# Next 16.4's useRouter() reads parentRenderTree off the router context Storybook
# mounts, and @storybook/nextjs-vite 10.5–10.6 does not set it, so every screen story
# (apps/visual-diff-ui/app/_screens) failed to render. Remove this entry once a
# release sets the field; apps/storybook/.storybook/main.ts says the same.
patchedDependencies:
  '@storybook/nextjs-vite@10.6.2': patches/@storybook__nextjs-vite@10.6.2.patch
