# A green patch/minor bump merges itself — auto-merge still waits on the
# `gate` check, which is the point. Majors wait for a human.
#
# The explicit `permissions` block is load-bearing: Dependabot-triggered runs
# get a read-only GITHUB_TOKEN by default and `gh pr merge` 403s without it.
name: dependabot-auto-merge

# Note: merges made with GITHUB_TOKEN do not trigger pr.yml's push-to-main
# run — the post-merge cache-seeding run is skipped for bot merges. Accepted:
# it matches the "Dependabot builds cold" stance; strict up-to-date protection
# keeps correctness intact.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Both checks matter: actor gates the event, author gates the PR itself
    # (a human push to a bot branch flips the actor and disables auto-merge).
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04-arm
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
