# The gate, thin form. Wave 3 adds an `e2e` job to `gate.needs` — no
# branch-protection edit ever needed again: `gate` is the only required check.
#
# `visual-diff` (below) is deliberately NOT in that list. Per
# apps/blog/content/posts/visual-regression-with-agents.mdx: a numeric pixel
# threshold stops being a safety net once change volume is high (an agent
# refactoring thirty components in an afternoon), and "approving a baseline
# has to cost the same as reviewing a code diff" — i.e. a person, in the PR,
# not a required check nobody reads before merging. The job still runs, still
# fails loudly (a real ❌ in the checks list) on a real diff, and still posts
# the report as a PR comment — it just never blocks a merge on its own.
name: pr

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is load-bearing, not decorative. Every job below is
    # skipped while the PR is a draft, and GitHub counts a skipped required
    # check as PASSING. Without this event the draft's skipped-therefore-green
    # `gate` would still be standing when the PR is marked ready, and it would
    # be mergeable having never run a check. Never remove it while the draft
    # guard on the jobs exists — the two are a matched pair.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Least privilege: every job executes package scripts from the PR head
# (agent-authored branches are the main traffic on a public repo).
permissions:
  contents: read

# Superseded PR runs are pure waste under strict up-to-date protection —
# cancel them. Push-to-main runs are never cancelled (they seed the caches).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI and the Sandcastle sandboxes share one remote cache. TURBO_TOKEN is an
  # Actions secret, TURBO_TEAM a repo variable (configured with the cache link).
  # Dependabot-triggered runs see neither and simply build cold — accepted.
  # Known trade-off (documented in the plan): the token is write-capable and
  # visible to PR-head code on same-repo branches; acceptable while every
  # issue body is maintainer-authored. Revisit (signature key or read-only
  # PR token) if dispatch ever loosens.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

# Draft PRs do not run the gate. GitHub has no draft filter at the `on:` level
# — a draft fires opened/synchronize like any other PR — so the guard has to sit
# on every job, and it has to sit on `gate` too: skip the five workers alone and
# `gate` (if: always()) would see five skips and fail the draft red.
#
# The `event_name` half is not redundant. On push-to-main there is no
# `github.event.pull_request`, and leaning on GitHub's null-to-false coercion to
# carry that case is a silent footgun. Say it out loud instead.
#
# Repeated per job because GitHub Actions does not support YAML anchors. A new
# job added in a later wave needs this line — and, unless it's meant to stay
# informational like `visual-diff`, an entry in `gate.needs` too.
#
# On the action pins below: `cache: pnpm` is set explicitly and must stay that
# way. setup-node v5 started auto-enabling the cache whenever package.json has a
# `packageManager` field (this repo pins pnpm there), then v6 narrowed that
# auto-detection to npm only. Naming the package manager outright means neither
# swing reaches us. The `corepack enable` step also has to stay ahead of
# setup-node — `cache: pnpm` resolves the pnpm store path at key-computation
# time, so pnpm must already be on PATH.
jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # --affected and TURBO_SCM_BASE need the base SHA in history; the
          # default shallow clone silently degrades "affected" to "everything".
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  typecheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  sandcastle:
    # The orchestrator's own hermetic suite: prompt contracts, merge flow,
    # model-override grammar. Agents edit prompts; this is what catches them.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `turbo run typecheck` only reaches workspaces, and .sandcastle/ is not
      # one — so 2.5k LOC of orchestrator had no type gate at all until this
      # step. Runs before the suite: a type error should not be reported as a
      # test failure.
      - run: pnpm typecheck:sandcastle
      - run: pnpm test:sandcastle

  format:
    # Prettier is the formatter of record for the whole repo, including
    # .sandcastle/*.mts (added to the glob so the orchestrator is held to the
    # same printWidth as everything else). `--check` fails the job on any drift.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  health:
    # Cognitive-complexity ceiling — COGNITIVE, not cyclomatic (cyclomatic
    # over-counts flat guard sequences); see scripts/complexity-gate.mjs.
    # `pnpm health:check` = `turbo run health` (per-workspace, cached/parallel —
    # unchanged apps hit the shared turbo remote cache) + a standalone
    # .sandcastle/ check (orchestrator scripts, not a turbo workspace).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm health:check

  visual-diff:
    # Not in gate.needs — see the file header. Runs on the pinned
    # arm64 + Playwright container `packages/visual-diff/src/policy.mjs`'s
    # `HOST` names, because `commands.mjs`'s `probeHost()` reports the real
    # `process.arch`, and the committed `__baselines__/BASELINE_ENV.json`
    # records `arch: "arm64"` — an amd64 runner would trip the host guard
    # (exit 2) on every run before a single pixel is compared.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    permissions:
      contents: read
      # Scoped to this job only — posts/updates the sticky report comment.
      # On a fork PR, `pull_request` hands every job a read-only token
      # regardless of this block, so the comment step below silently finds
      # nothing to post with; the run and the uploaded artifact still happen.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No download-artifact handoff from the parallel `build` job — every
      # job in this file builds what it needs itself. This one hits the
      # shared Turbo remote cache if `build` already primed it, and just
      # builds locally like `health`/`sandcastle` do if not.
      - run: pnpm turbo run build --filter=@gate/storybook
      - name: Run visual-diff
        id: visual-diff
        run: pnpm visual-diff
        # Exit 1 (a human must look) and exit 2 (broken) both mean "let the
        # comment/upload steps below still run" — only the explicit failing
        # step at the end turns that into the job's real, visible result.
        continue-on-error: true
      - name: Post report comment
        # Only meaningful on a PR — push-to-main has no PR to comment on.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- visual-diff-report -->';
            const summaryPath = 'packages/visual-diff/.visual-diff/summary.md';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : 'visual-diff did not produce a summary — the run itself is broken (see the job log).';
            const body = `${marker}\n${summary}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diff-report
          path: packages/visual-diff/.visual-diff/
          retention-days: 14
      - name: Fail the job if visual-diff found something
        # The real signal: a visible, non-required ❌ in the PR checks list.
        # Never added to gate.needs — see the file header.
        if: steps.visual-diff.outcome == 'failure'
        run: exit 1

  gate:
    # The aggregator — the ONLY required status check. `if: always()` so it
    # reports even when a needed job fails; it fails unless every result is
    # exactly 'success' (skipped/cancelled count as failure).
    needs: [lint, typecheck, build, test, sandcastle, format, health]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Fail unless every needed job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "needs results: ${{ toJSON(needs.*.result) }}"
          exit 1
      - name: All checks green
        run: echo "gate green — every needed job succeeded"
