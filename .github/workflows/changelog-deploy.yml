# Publishing a release is the only thing that changes what /changelog says, and it
# changes nothing in git — so nothing that watches git will rebuild the blog for it.
# This workflow is the missing edge: release published → ask for a build → prove the
# release actually reached the page.
#
# The proof is the point. Two mechanisms in this repository would happily swallow the
# request, and neither fails loudly on its own:
#
#   - apps/blog/vercel.json's ignoreCommand asks `turbo query affected` whether the
#     blog changed. On a rebuild of a commit that already deployed the answer is "no",
#     and Vercel skips the build. The ignoreCommand now exits early with "build" when
#     the previous and current SHAs are the same commit, which is what a deploy hook
#     produces — nobody rebuilds an identical commit by accident.
#   - Even when it builds, the releases fetch sits behind `'use cache'` with a `max`
#     profile, and Vercel restores .next/cache between builds. `?buildCache=false` is
#     what makes the deployment recompute it rather than replay the previous answer.
#
# Both are corrections to guards that were written for a world where a rebuild of an
# unchanged commit is pointless. That assumption is right everywhere else in this repo,
# which is why the fix is scoped to the blog and why this job verifies rather than
# assumes: it polls the deployed page for the tag it just published, and fails if the
# tag never arrives. A green run here is evidence the whole chain works; a red one says
# the page is stale and names the release that did not land.
name: changelog-deploy

on:
  release:
    types: [published]
  # For re-running by hand after a fix, or after publishing a release while this was
  # broken. `tag` names the release the poll should wait for.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag the changelog must show (e.g. v1.3.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # SITE_URL's host, pinned by apps/blog/__tests__/changelog.test.ts for the
  # reason changelog-check.yml gives at more length: a custom domain leaves this
  # alias resolving, so a stale copy here polls an origin nobody reads.
  ORIGIN: https://acceptance-gate-blog.vercel.app

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    # The poll below is capped at ~10 minutes; the rest is the blog build itself.
    timeout-minutes: 20
    steps:
      # The hook URL is a full credential — anyone holding it can spend build minutes
      # on this project — so it is a secret rather than a repo variable, unlike
      # TURBO_TEAM. `buildCache=false` is the half that matters: without it the
      # deployment can restore the cached releases fetch and rebuild the old page.
      - name: Ask Vercel to rebuild the blog without its build cache
        env:
          DEPLOY_HOOK_URL: ${{ secrets.BLOG_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "BLOG_DEPLOY_HOOK_URL is not set — nothing can rebuild the blog." >&2
            exit 1
          fi
          curl --fail --silent --show-error --request POST \
            "${DEPLOY_HOOK_URL}?buildCache=false" > /dev/null
          echo "Requested a blog rebuild for ${TAG}."

      # Polling the live page rather than the Vercel API on purpose: the API would
      # report that a deployment happened, and a deployment happening is not the
      # requirement. The requirement is that a reader sees the release.
      - name: Wait for the release to appear on the changelog
        run: |
          url="${ORIGIN}/changelog"
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error "$url" | grep -qF "$TAG"; then
              echo "${TAG} is on the changelog (attempt ${attempt})."
              exit 0
            fi
            echo "Not there yet (attempt ${attempt}); waiting."
            sleep 15
          done

          echo "::error::${TAG} never appeared on ${url}." >&2
          echo "The deploy was skipped, the build replayed a cache, or the fetch failed." >&2
          exit 1
