# Scheduled, read-only drift check for .github/rulesets/*.json against the live
# ruleset on GitHub. Fixes #233.
#
# Why a separate workflow rather than a `checks` leg or a `gate.needs` entry:
# drift is a property of the repository's settings, not of the commit under
# review. A settings change made in the web UI has no PR to be red on, so
# putting this in the gate would block unrelated PRs on someone else's edit —
# wrong and infuriating. Same shape as `visual-diff` in pr.yml: it runs, it
# fails loudly, it blocks nothing. Never add this to `gate.needs`.
#
# Why this is safe to run in Actions at all, when scripts/apply-ruleset.mjs
# deliberately does not: applying a ruleset needs a token that can write
# branch protection, and putting a credential that can *remove* protection
# inside the CI that protection guards is not a trade worth making. That
# argument is about writing. Reading is a different scope — fine-grained
# permissions separate them, where a coarse classic PAT's `admin:repo` would
# not — and `permissions: { administration: read }` gets a job-scoped,
# auto-expiring GITHUB_TOKEN that can read rulesets and cannot write them.
#
# Do not add `--apply` to the run step, on this or any trigger. Do not widen
# `administration` to `write`, and do not swap GITHUB_TOKEN for a PAT — either
# one reintroduces exactly the credential the design above avoids.
#
# Failure visibility: a scheduled workflow has no PR to post a red check on,
# so a failed run is only visible in the Actions tab and the workflow's own
# run history — nobody watches that by default. No notification integration
# exists for this yet; that is a known limitation, not an oversight, and
# adding one (e.g. posting to an issue, a chat webhook) is future work.
name: ruleset-drift

on:
  schedule:
    # Daily is plenty — drift (a ruleset edited in the web UI instead of
    # through main.json) is a rare event, not a per-commit one.
    - cron: '17 6 * * *'
  workflow_dispatch:

# Read-only ON PURPOSE. contents: read is the checkout; administration: read
# is what lets `gh api repos/{owner}/{repo}/rulesets` see the live ruleset.
# Neither can write. No other permission is granted.
permissions:
  contents: read
  administration: read

jobs:
  drift-check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Zero-dep and shells out to `gh`, which is preinstalled on GitHub
      # runners — no `pnpm install` needed, just checkout + setup-node + run.
      # No --apply: this only ever reads. Exits 1 naming the mismatched
      # path(s) if the live ruleset no longer satisfies main.json, 0 if it
      # does.
      - run: node scripts/apply-ruleset.mjs
        env:
          GH_TOKEN: ${{ github.token }}
