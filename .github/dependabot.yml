# Dependency maintenance is part of the thesis: bump PRs run through the same
# gate as feature work. Minor+patch grouped weekly (a pnpm monorepo without
# grouping is a PR-per-package noise machine); majors arrive individually.
#
# The ignore list has three kinds of entry, and the difference matters when you
# come to remove one.
#
# ALL UPDATES IGNORED — a bump here is a hand-authored issue, never a bot PR,
# because landing it means changing more than a version number:
# - playwright: a bump must move the container image, the policy-sync test and
#   a mass-rebaseline together
# - storybook: the differ's capture URL rides Storybook's internal globals
#   serialization, and any Storybook bump can shift pixels (reds the gate)
# - pnpm: pinned via packageManager + sha512
# - @axe-core/*: a bump changes which rules the a11y scenarios enforce, so
#   it's a deliberate review of new violations against real markup, not a
#   version number to roll forward
#
# MAJORS ONLY IGNORED — the next major is blocked UPSTREAM, so there is no diff
# that makes it work and reopening the PR only re-proves that. These are not
# "we will do it by hand"; they are "do not ask again until the checks written
# into the issue start passing." Minor and patch updates still flow, which is
# the whole reason these are scoped rather than blanket:
# - eslint: #68. eslint-config-next@16's own dependencies eslint-plugin-react
#   and eslint-plugin-jsx-a11y both declare peer ranges topping out at ESLint 9
#   and still call the context.getFilename() API that ESLint 10 removed.
#   Re-verified 2026-08-13 against PR #221, which failed on exactly the stack
#   frame #68 recorded. The issue carries the three commands that decide when
#   this entry comes out.
# - typescript: #47. TS 7 removes `baseUrl` (TS5102) and typescript-eslint 8.x
#   refuses TS 7.0 outright, so the `lint` leg fails independently of anything
#   Next does. Re-verified 2026-08-13 against PR #223. Note that #223 died at
#   TS5102 before reaching #47's headline finding, so that one is still
#   unmeasured under Next 16 — removing this entry needs that measurement, not
#   just a green npm-view.
#
# Both blocked entries stay until their issue's own re-check commands pass.
# Deleting one without running them puts a permanently red PR back on the board.
#
# TRACKS THE RUNTIME — majors only, and not because anything upstream is
# broken. The version is pinned to something else in this repo, so the bump is
# not wrong, it is early:
# - @types/node: engines pins node to >=22.14.0 <23.0.0 and .nvmrc is 22.14.0,
#   which is what every CI job installs. Types must describe the runtime
#   that actually runs the code; on @types/node 26 tsc green-lights Node 26
#   APIs that throw on 22, and typecheck goes green precisely because it has
#   been told to describe a different runtime — so a red gate is not what
#   catches this one. 22.20.1 is the last of the 22 line (DefinitelyTyped
#   published it 2026-07-08), which makes this a stable pin rather than rot:
#   there is no minor or patch left to miss. It comes out in the same commit
#   that moves .nvmrc off 22 — never before it, and never on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:
      - dependency-name: playwright
      - dependency-name: "@playwright/*"
      - dependency-name: storybook
      - dependency-name: "@storybook/*"
      - dependency-name: pnpm
      - dependency-name: "@axe-core/*"
      # Scoped to majors on purpose — see the header. A 9.x or 5.x bump is
      # still wanted and still flows through the weekly group.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Pinned to .nvmrc/engines rather than to upstream — see the header.
      # Moves with the Node major, in that commit, not by bot.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
